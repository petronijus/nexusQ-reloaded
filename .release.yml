name: nexusq-reloaded
tag_format: v{version}
version_files: []                 # tag-only versioning (kernel port milestones)
changelog: CHANGELOG.md
artifacts:
  mode: local                     # built locally (pmbootstrap/Docker), not in GitHub CI
  # PUBLIC_RELEASE=1: release artifacts must NOT contain the baked personal
  # access (WiFi PSK / ssh keys) — the preflight below verifies it.
  # docker-build.sh runs inside the builder container; on the host it refuses.
  local_build: >-
    docker build -t nexusq-builder . &&
    docker run --rm --privileged -e PUBLIC_RELEASE=1 -v "$PWD:/src:ro"
    -v nexusq-output:/tmp/output -v nexusq-workdir:/home/pmos/.local/var/pmbootstrap
    nexusq-builder /src/docker-build.sh
  # The build writes boot.img + google-steelhead.img into the nexusq-output
  # volume; `scripts/package-release.sh vX.Y.Z --from-volume` copies them out,
  # renames them to the versioned scheme and sparse-converts the rootfs
  # (raw2simg.py) into output/:
  local_upload:
    - nexusq-boot-v*.img
    - nexusq-rootfs-v*-sparse.img.zst   # rootfs is zstd-compressed (all-RAW sparse > 2 GiB GitHub asset limit)
registry:
  images: []
preflight_extra:
  # Refuse to publish a rootfs with baked-in personal access (WiFi PSK /
  # ssh authorized_keys) — release artifacts must come from
  # a PUBLIC_RELEASE=1 build (local_build above), this verifies it.
  - scripts/release-preflight-no-secrets.sh
