# Bootstrap the clock WITHOUT needing DNS.
#
# Every boot starts at 2000-01-01: the TWL6030 RTC has no backup cell, so a
# mains unplug resets its counter, and `dmesg` says so ("Power up reset
# detected"). systemd-resolved validates DNSSEC, and against a clock 26 years in
# the past every signature looks expired:
#
#     resolvectl query petronijus.github.io
#     ... resolve call failed: DNSSEC validation failed: signature-expired
#
# systemd-timesyncd shipped only FallbackNTPServers=*.pool.ntp.org — HOSTNAMES.
# So: no time -> no DNS -> cannot resolve an NTP server -> no time. The device
# sat in that deadlock after the 2026-08-18 reboots with `apk update` reporting
# "6 stale" and every OTA fetch failing on "bad address", which looks like a
# network fault and is not one.
#
# IP LITERALS break the cycle: timesyncd reaches an NTP server before DNS is
# involved at all. Cloudflare and Google anycast, which are stable addresses.
#
# ANYCAST FIRST, and no LAN gateway here. This list used to lead with
# 192.168.20.1 — Prague's gateway — in a package that ships to every unit. At
# the cottage that address is on another site's subnet entirely, so timesyncd
# spent its whole retry budget on a server that cannot answer before rotating
# to a real one. Measured on the Šumperák Q on 2026-09-18, after the kernel OTA
# to 6.18.48-r2: `timedatectl` reported "System clock synchronized: no" with
# "Packet count: 0" minutes into the boot, the clock sat at 2000-01-01, and the
# HTTPS fetch in `nq-kernel-ota reconcile` failed against it — the package
# database was left describing the previous kernel until timesyncd was
# restarted by hand and the step re-run.
#
# 6.18.48-r2 made this sharper rather than milder. Before it the RTC never
# ticked at all and the wrong time was obviously absent; now the RTC runs, so
# the device holds a confident, precise, 26-year-old clock until NTP lands, and
# everything that checks a certificate fails in the meantime.
#
# A site WITH its own NTP server gets it by dropping a file that sorts after
# this one (e.g. 20-<site>-ntp.conf) with its address prepended — a per-site
# value belongs in the per-site overlay, not in the fleet package.
[Time]
NTP=162.159.200.1 216.239.35.0
FallbackNTP=162.159.200.123 216.239.35.4
