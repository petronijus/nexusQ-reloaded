# This unit's ssh host keys live in the persist store (nq-persist), so a flash
# no longer changes its fingerprint. nq-persist apply renders the list below
# on every boot with exactly the keys that exist; when the store is absent the
# include matches nothing and sshd falls back to its /etc/ssh defaults.
# HostKey lines from an include REPLACE the defaults (OpenSSH 10.5, verified).
Include /run/nexusq/sshd-hostkeys.conf
