# Credit the saved random seed at boot (device r114, 2026-09-26).
#
# systemd-random-seed.service loads /var/lib/systemd/random-seed into the kernel
# pool early, then blocks until the kernel's CRNG is initialised before it
# finishes -- and sysinit.target waits for it. This systemd build does not credit
# the seed unless told to ("$SYSTEMD_RANDOM_SEED_CREDIT is not set, not crediting
# entropy"), and this SoC offers no hardware RNG to the kernel (no /dev/hwrng on
# the HS OMAP4460), so the CRNG had to gather entropy on its own: `random: crng
# init done` came 17-74 s into boot across the last ten boots of the cottage Q,
# and sysinit.target 0.03 s after it every time (74.57 s on the worst).
#
# =1 is the careful setting, not "force": systemd credits only a seed file it
# marked `user.random-seed-creditable` itself (written from an initialised pool on
# this machine), never on a first boot, and refreshes the file right after. A
# fresh image carries no seed (verify-rootfs checks it), so the first boot after
# a flash still gathers its own entropy; every boot after that starts at once.
# `nq-rootfs-ab populate` drops the seed from the copy it makes, so two slots
# never credit the same one.
[Service]
Environment=SYSTEMD_RANDOM_SEED_CREDIT=1
