# Nexus Q core dump bounds (device r123, with kernel 6.18.48-r19).
#
# Crashes have been caught here all along, through systemd's legacy pipe
# helper: /usr/lib/sysctl.d/50-coredump.conf sets
# kernel.core_pattern=|/usr/lib/systemd/systemd-coredump ... . systemd 262's
# coredump manager, which replaces that pipe with a socket, needs
# PIDFD_INFO_SUPPORTED_MASK (kernel 6.19) and skipped itself on 6.18, failing
# its Kernel Core Pattern Register unit on every transaction that touched
# sysinit.target (71 times in one 1 h 17 min boot). Patch 0060 backports that;
# from r19 the manager runs, core_pattern is @@/run/systemd/coredumpd/kernel.
#
# The bounds were systemd's defaults, and are now chosen instead: a core may be
# 1 GiB on 32-bit and the store up to 10 % of the 6.3 GB rootfs, all of it
# compressed on the two Cortex-A9 cores that play the music. What crashes here,
# by size of process (VmSize, Prague Q, 2026-09-30):
#   our daemons       nexusqd, nq-healthd, the Python daemons: < 32 MiB
#   pulseaudio, librespot                                     ~ 25-80 MiB
#   RoonBridge, RAATServer, RoonBridgeHelper (.NET, in our glibc-rt sandbox):
#                                                             200-280 MiB
# The one Roon core on that unit (RoonBridgeHelper, SIGSEGV, 2026-09-28) is
# 184 MiB, 6.6 MiB compressed. Roon runs in a sandbox we built, so its cores
# are ours to read: 384 MiB keeps every process here whole, and refuses only
# something that has grown past anything this box runs. A crash loop is bounded
# by the unit's own start limit (5 starts in 10 s by default), and MaxUse and
# KeepFree bound the store; the oldest cores go first. The journal's own cap is
# 20-nexusq-journal-size.conf; the 20- prefix sorts after any distribution
# drop-in (see that file on why it matters).
[Coredump]
ProcessSizeMax=384M
ExternalSizeMax=384M
MaxUse=256M
KeepFree=1G
