# Nexus Q journal size cap.
#
# The device is NOT running on systemd's stock default here: postmarketOS ships
# /usr/lib/systemd/journald.conf.d/10-postmarketos.conf with SystemMaxUse=1G.
# So the journal was never uncapped -- it was capped at a gigabyte, and on
# 2026-09-16 it had grown to 645.5 MB of a 6.3 GB rootfs and was still climbing
# toward that limit.
#
# A gigabyte is a sensible default for a general-purpose pmOS phone. It is the
# wrong shape for an appliance whose whole job is playing music: a sixth of the
# disk, on eMMC, for logs nobody reads until something breaks. Most of that
# 645 MB was nq-healthd opening a PAM login session every five minutes (~830 in
# under three days), which device r99 removed -- so this is not load-bearing for
# that bug any more. It stays because the next chatty regression should cost
# megabytes and be noticed, not quietly eat a gigabyte and look normal.
#
# The 20- prefix is not decoration: drop-ins are applied in lexicographic order
# of filename across all the directories systemd searches, so this has to sort
# after 10-postmarketos.conf to win. A name without a numeric prefix happens to
# sort later today ("j" > "1") but only by accident, and the accident reverses
# the moment anyone renames anything.
#
# SystemMaxFileSize keeps the vacuum granular. Without it systemd sizes journal
# files as a fraction of the cap and discards WHOLE files, so a 128 MB cap would
# throw away history in far coarser steps than expected.
[Journal]
SystemMaxUse=128M
SystemMaxFileSize=16M
