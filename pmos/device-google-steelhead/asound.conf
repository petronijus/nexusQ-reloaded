# Nexus Q audio — RETIRED ALSA topology.
#
# This file used to define a `nexusq` PCM that TEED playback to both the TAS5713
# speaker and the snd-aloop `Loopback` card, plus a `nexusq_soft` softvol, back
# when librespot output through ALSA (`--device nexusq_soft`) and nexusqd's LED
# visualizer tapped `arecord hw:Loopback,1`. Both are gone: librespot now outputs
# `--device pulse`, and the visualizer reads `arecord -D pulse` off PulseAudio's
# default-source monitor (userspace/nexusqd/audio.c). So the whole tee + softvol
# had no remaining consumer.
#
# The `Loopback,0,0`/`Loopback,1,0` substream that the old tee fed is now used by
# the USB Audio input for its stable-clock snd-aloop hop
# (alsaloop -> hw:Loopback,0,0, PA reads hw:Loopback,1,0 as source `usb_in`; see
# nexusq-uac2-in). The defs were removed so nothing can accidentally re-open the
# tee and claim that substream. The 48 kHz pinning that used to live here is now on
# the PA side (/etc/pulse/daemon.conf.d/50-nexusq-48k.conf).
#
# Kept as an installed (empty) file for documentation; safe to delete outright once
# the stale references in APKBUILD / 91-pulseaudio-hdmi-ignore.rules comments are
# swept.
