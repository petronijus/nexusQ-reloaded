# Stationary single-AP appliance: disable in-firmware roaming / background roam
# scans. On the BCM4330 those background scans fail (the kernel log floods with
# `brcmf_escan_timeout: timer expired`) and eventually WEDGE the associated data
# path — the link still shows "connected" with good signal, but throughput drops
# to zero (100% packet loss to the gateway). Measured 2026-07-31: after ~8 h
# uptime wlan0 was associated at -44 dBm yet could not ping its own gateway; a
# `roamoff=1` reload restored it and stopped the escan flood. The Nexus Q is
# bolted to one AP and never roams, so in-firmware roaming is pure downside here.
# Pairs with brcmfmac-mpc-off.conf (mpc=0) and brcmfmac-no-p2p.conf.
options brcmfmac roamoff=1
