# serial-getty@ttyGS0.service.d/10-nexusq-no-tty-reset.conf
#
# No TTY reset on the USB gadget console. With TTYReset=yes, systemd 262's
# executor takes the BSD lock on /dev/console and, while holding it, writes the
# OSC 3008 context sequence to the service's tty with a blocking fflush(stdout)
# (src/core/exec-invoke.c, the "constructive" reset). ttyGS0 never takes a byte
# while no USB host is attached: u_serial's gs_write_room() returns 0 without a
# bound port. So every getty restart after a cable pull (the hangup ends agetty,
# Restart=always brings it back) leaves an executor asleep in writev() holding
# the console lock, and the next TTY reset in PID 1 -- the HDMI desktop starting
# or stopping, getty@tty1 -- blocks PID 1 in flock(): logind, ssh logins and
# systemctl hang until a host is plugged in again.
# docs/gpu-sgx540/stall-and-panic-2026-10-12.md has the measurements.
#
# Without TTYReset the executor takes no lock and writes nothing (systemd only
# sends ANSI sequences when TTYReset is on); agetty itself still waits for a
# host in its own write, which blocks nobody. A reset is of no use on this port
# anyway: there is no screen state to clean up on the other end of an ACM link.
[Service]
TTYReset=no
