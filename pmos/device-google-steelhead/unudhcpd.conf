# The Nexus Q's USB-net gadget subnet: the Q is .1, the host it is plugged
# into is .2 (handed out by postmarketOS's unudhcpd@usb0, which reads this file
# as its EnvironmentFile, and nexusq-usb-gadget.sh takes its own address from
# it, so the two cannot disagree).
#
# NOT postmarketOS's default 172.16.42.0/24. Every pmOS device's gadget sits
# there -- Petr's Lumia 1020 included -- and with both plugged into one host,
# both device ends are 172.16.42.1 and the host routes that address to
# whichever interface has the lower metric. The Lumia's tooling reached the Q
# (2026-09-28). The initramfs copy (scripts/initramfs/nq-gadget.sh) uses the
# same subnet.
UNUDHCPD_SERVER=172.16.43.1
UNUDHCPD_CLIENT=172.16.43.2
