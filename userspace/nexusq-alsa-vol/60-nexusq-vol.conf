# ctl.nexusq_vol -- the Nexus Q's one volume (the PulseAudio default sink) as an
# ALSA mixer control with a dB scale, for players that drive a hardware mixer:
#   librespot --mixer alsa --alsa-mixer-device nexusq_vol --alsa-mixer-control Master
#   shairport-sync: mixer_device = "nexusq_vol"; mixer_control_name = "Master";
# See userspace/nexusq-alsa-vol/README.md.
ctl.nexusq_vol {
	type nexusq_vol
}
