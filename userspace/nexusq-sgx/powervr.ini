; /etc/powervr.ini -- application hints for TI's SGX540 DDK userspace (read
; by libsrv_um's PVRSRVGetAppHint; the [default] section applies to every
; client). Installed by nexusq-sgx; the DDK blobs themselves are untouched.
;
; ParamBufferSize: the parameter buffer the tile accelerator writes a frame's
; geometry into, per GL client, in bytes. With the DDK's default, glmark2's
; terrain scene overflowed it ("SGXKickTA: TA went out of Mem and SPM occurred
; during last TA kick"): the frame is then rendered in partial passes, slowly.
; 8 MiB carries that scene with no overflow, measured on the Prague unit
; 2026-10-13 (docs/gpu-sgx540/performance-2026-10-13.md); every GL client
; (labwc, a video player) holds one, so it is not set larger than that.
[default]
ParamBufferSize=8388608
